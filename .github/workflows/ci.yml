name: CI

# main pushes and pull requests only. WIP branches don't send failure mail;
# they are checked by their PR, or by the deploy gate before merging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 65 # Lighthouse alone takes ~26 min for 27 URLs × 5 runs (2026-10-10), ~42 min on slow runners (2026-10-22, IDCAM1022 added a URL); assertions unchanged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Sprint C, C2: the checks job builds with PUBLIC_BG_REMOVE=1, so Lighthouse covers /remove-background/ and the
      # unit tests read a build that has it. The shipping (flag-off) build is checked by every e2e job's builds
      # (check-dist fails a flag-off build that carries any trace of the page).
      # ADDREN1016 decision 19: 영문주소 변환기 on too (it needs the privacy officer and contact), so Lighthouse covers
      # /english-address/ and the unit tests read a build that has it.
      - name: Build (copy-vendor, gen-licenses, gen-ui-font, astro build, check-dist; 배경 지우기 and 영문주소 on)
        run: npm run build
        env:
          PUBLIC_BG_REMOVE: '1'
          PUBLIC_ADDR_EN: '1'
          PUBLIC_PRIVACY_OFFICER: '이종림'
          PUBLIC_CONTACT_EMAIL: 'robotncoding@kakao.com'
      - name: Typecheck
        run: npm run check
      - name: Unit tests (incl. static network-API guard)
        run: npm test
      - name: License gate
        run: npm run check:licenses
      - name: Ink key regression (committed GT fixtures; real photos are local only)
        run: npm run regress:ink -- --fixtures-only
      - name: Install Chromium (regress:bgremove)
        run: npx playwright install --with-deps chromium
      - name: Background removal regression (real model on the committed CC0 fixtures, WASM; the spike sets are local only)
        run: npm run regress:bgremove -- --fixtures-only --backend wasm
      - name: Lighthouse CI
        run: npm run lhci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-checks
          path: .lighthouseci/
          # upload-artifact (v4 and later) skips dot-folders by default; without this the Lighthouse reports never upload.
          include-hidden-files: true
          retention-days: 7

  # PRINT1023 A (brief P14): the 증명사진 촬영 kill switch (PUBLIC_ID_CAMERA=0) is built on every PR, in parallel with the
  # other jobs. Build 1: defaults; build 2: the production flags of dist-bgcloud below. check-dist runs in postbuild; after
  # each build the unit tests that read dist/ run with the same env. postbuild.test.ts runs after build 1 only: it assumes
  # a GA-, AdSense- and usage-off dist (5 of its tests fail on any dist-bgcloud-like build, camera on or off; BUILD-LOG
  # PRINT1023 A Known Gaps). ga.test.ts is left out: it runs its own GA-on build, covered by the checks job.
  # AFF1029 (brief Build Order 7): build 3 is the LinkPrice kill switch (PUBLIC_AFF_LINKPRICE=0): check-dist asserts no
  # LinkPrice link anywhere and the Coupang fallbacks (/loan-note/ and the 공동인증서 screens: 도장).
  flag-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build (camera off, defaults; check-dist in postbuild)
        run: npm run build
        env:
          PUBLIC_ID_CAMERA: '0'
      - name: Unit tests that read dist/ (camera off, defaults)
        run: npx vitest run tests/unit/postbuild.test.ts tests/unit/en-check.test.ts tests/unit/hwp-viewer.test.ts
        env:
          PUBLIC_ID_CAMERA: '0'
      - name: Build (camera off, production flags as dist-bgcloud; check-dist in postbuild)
        run: rm -rf dist && npm run build
        env:
          PUBLIC_ID_CAMERA: '0'
          PUBLIC_BG_REMOVE: '1'
          PUBLIC_BG_CLOUD: '1'
          PUBLIC_PRIVACY_OFFICER: '이종림'
          PUBLIC_CONTACT_EMAIL: 'robotncoding@kakao.com'
          PUBLIC_USAGE_STATS: '1'
          PUBLIC_GA_ID: 'G-TEST000000'
          PUBLIC_AFF_COUPANG: '1'
          PUBLIC_ADDR_EN: '1'
          PUBLIC_ADSENSE_ON: '1'
          PUBLIC_ADSENSE_CLIENT: 'ca-pub-0000000000000000'
      - name: Unit tests that read dist/ (camera off, production flags)
        run: npx vitest run tests/unit/en-check.test.ts tests/unit/hwp-viewer.test.ts
        env:
          PUBLIC_ID_CAMERA: '0'
          PUBLIC_BG_REMOVE: '1'
          PUBLIC_BG_CLOUD: '1'
          PUBLIC_PRIVACY_OFFICER: '이종림'
          PUBLIC_CONTACT_EMAIL: 'robotncoding@kakao.com'
          PUBLIC_USAGE_STATS: '1'
          PUBLIC_GA_ID: 'G-TEST000000'
          PUBLIC_AFF_COUPANG: '1'
          PUBLIC_ADDR_EN: '1'
          PUBLIC_ADSENSE_ON: '1'
          PUBLIC_ADSENSE_CLIENT: 'ca-pub-0000000000000000'
      - name: Build (camera off, LinkPrice off; check-dist in postbuild)
        run: rm -rf dist && npm run build
        env:
          PUBLIC_ID_CAMERA: '0'
          PUBLIC_AFF_LINKPRICE: '0'
      - name: Unit tests that read dist/ (camera off, LinkPrice off)
        run: npx vitest run tests/unit/postbuild.test.ts
        env:
          PUBLIC_ID_CAMERA: '0'
          PUBLIC_AFF_LINKPRICE: '0'

  # One job per Playwright project, run in parallel. The full 5-project suite in a
  # single job ran past the 30-minute limit.
  e2e:
    runs-on: ubuntu-24.04
    # 60, not 45 (G2 A1): on 2026-10-01 the webkit job's `playwright install --with-deps` spent 34 min on slow
    # azure.archive.ubuntu.com downloads (5 min on ci-green the same day), twice in a row; the tests take ~13 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Same order as the local deploy gate: the shipping build (auto-frame off) goes to
      # dist-noauto/ for the manual-chromium and manual-firefox projects, then dist/ is built with the flag on
      # because the id-photo specs on the other projects need MediaPipe.
      - name: Build (flag off → dist-noauto)
        run: npm run build && mv dist dist-noauto
        env:
          PUBLIC_ID_PHOTO_AUTOFRAME: '0'
      - name: Build (flag on → dist)
        run: npm run build
        env:
          PUBLIC_ID_PHOTO_AUTOFRAME: '1'
      # Sprint C, C2: /remove-background/ exists only with PUBLIC_BG_REMOVE=1; its spec runs on dist-bg/ as the
      # bg-chromium and bg-mobile-safari projects (brief: chromium + mobile-safari). Built last: dist/ keeps the
      # flag-on auto-framing build of the step above.
      - name: Build (배경 지우기 on → dist-bg)
        if: matrix.project == 'chromium' || matrix.project == 'mobile-safari'
        run: mv dist dist-keep && npm run build && mv dist dist-bg && mv dist-keep dist
        env:
          PUBLIC_BG_REMOVE: '1'
      # C2-cloud: the cloud path of 배경 지우기 (PUBLIC_BG_CLOUD=1 needs the privacy officer and contact) goes to
      # dist-bgcloud/ for the cloud-<project> projects, in all five browsers. /api/remove-bg is answered by page.route
      # fixtures; no test reaches Cloudflare. The same build carries the anonymous usage statistics (usage.spec.ts;
      # /api/usage is page.route'd too) and Google Analytics with a test ID (ga.cloud.spec.ts; gtag.js and the collect
      # hosts are stubbed by the no-upload fixture). The default and checks builds stay GA-off.
      # REV2 round 2 (Arch): it also has the Coupang affiliate links on, as production does (PUBLIC_AFF_COUPANG=1), so the
      # 450 KB precache gate measures the real production build; usage.spec.ts checks the links (link.coupang.com stubbed).
      - name: Build (배경 지우기 cloud on → dist-bgcloud)
        run: mv dist dist-keep && npm run build && mv dist dist-bgcloud && mv dist-keep dist
        env:
          PUBLIC_BG_REMOVE: '1'
          PUBLIC_BG_CLOUD: '1'
          PUBLIC_PRIVACY_OFFICER: '이종림'
          PUBLIC_CONTACT_EMAIL: 'robotncoding@kakao.com'
          PUBLIC_USAGE_STATS: '1'
          PUBLIC_GA_ID: 'G-TEST000000'
          PUBLIC_AFF_COUPANG: '1'
          # ADDREN1016 decision 19: english-address.cloud.spec.ts runs here (/api/addr-en is page.route'd).
          PUBLIC_ADDR_EN: '1'
          # ADS1020: the AdSense review-stage tag on the content pages, with a test client (ads.cloud.spec.ts; adsbygoogle.js
          # is stubbed by the no-upload fixture). The default and checks builds stay AdSense-off.
          PUBLIC_ADSENSE_ON: '1'
          PUBLIC_ADSENSE_CLIENT: 'ca-pub-0000000000000000'
      - name: Install Playwright browser
        run: |
          case "${{ matrix.project }}" in
            chromium|mobile-chrome) npx playwright install --with-deps chromium ;;
            firefox) npx playwright install --with-deps firefox ;;
            webkit|mobile-safari) npx playwright install --with-deps webkit ;;
          esac
      - name: E2E (no-upload assertion, axe)
        run: |
          if [ "${{ matrix.project }}" = chromium ]; then
            npx playwright test --project=chromium --project=manual-chromium --project=bg-chromium --project=cloud-chromium
          elif [ "${{ matrix.project }}" = mobile-safari ]; then
            npx playwright test --project=mobile-safari --project=bg-mobile-safari --project=cloud-mobile-safari
          elif [ "${{ matrix.project }}" = firefox ]; then
            npx playwright test --project=firefox --project=manual-firefox --project=cloud-firefox
          else
            npx playwright test --project=${{ matrix.project }} --project=cloud-${{ matrix.project }}
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
