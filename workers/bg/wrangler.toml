# docttak-bg: 배경 지우기 클라우드 처리 Worker (brief: handoff/ARCHITECT-BRIEF-C2-CLOUD.md §3).
# Reached only through the Pages service binding `BG`: no workers.dev URL, no routes.
name = "docttak-bg"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[images]
binding = "IMAGES"

# Per-IP limits, local to each Cloudflare location (brief §5, F14).
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_IP10"
namespace_id = "1002"
simple = { limit = 3, period = 10 }

# No logs: image bytes and request data must never be kept (brief §6).
[observability]
enabled = false
