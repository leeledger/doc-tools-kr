<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">신분증 사본과 주민등록표 등본·초본의 차이</title>
<rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">사본과 등본·초본은 달라요</text>
<rect x="30" y="64" width="320" height="206" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="190" y="92" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">신분증 사본</text>
<text x="54" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 내가 가진 신분증을 찍은 것</text>
<text x="54" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 휴대폰이나 스캐너로 직접</text>
<text x="54" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 발급받는 서류가 아님</text>
<text x="54" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 필요 없는 정보는 가리기</text>
<rect x="370" y="64" width="320" height="206" rx="6" fill="#fdf4e3" stroke="#8a5a00" stroke-width="1.5"/>
<text x="530" y="92" font-size="16" fill="#8a5a00" text-anchor="middle" font-weight="bold">주민등록표 등본·초본</text>
<text x="394" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 기관에서 발급하는 서류</text>
<text x="394" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 정부24·주민센터·무인발급기</text>
<text x="394" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 등본: 세대 구성원 전체</text>
<text x="394" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 초본: 한 사람의 상세 기록</text>
</svg>
