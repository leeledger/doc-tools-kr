<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">국제운전면허증을 본인과 대리인이 신청할 때 가져갈 것</title>
<rect x="0.5" y="0.5" width="719" height="329" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">국제운전면허증 신청 준비물</text>
<rect x="30" y="64" width="320" height="236" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="190" y="92" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">본인이 갈 때</text>
<text x="54" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 여권 (사본도 돼요)</text>
<text x="54" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 운전면허증</text>
<text x="54" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 여권용 사진 1장</text>
<text x="54" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 수수료 9,000원</text>
<rect x="370" y="64" width="320" height="236" rx="6" fill="#fdf4e3" stroke="#8a5a00" stroke-width="1.5"/>
<text x="530" y="92" font-size="16" fill="#8a5a00" text-anchor="middle" font-weight="bold">대리인이 갈 때</text>
<text x="394" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 본인 여권 (사본 가능)</text>
<text x="394" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 본인 운전면허증 원본</text>
<text x="394" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 여권용 사진 1장</text>
<text x="394" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 대리인 신분증 원본</text>
<text x="394" y="246" font-size="14" fill="#1c2321" text-anchor="start">· 위임장</text>
</svg>
