<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">카카오톡으로 받은 파일은 기간이 지나면 받을 수 없어 바로 저장해야 하는 흐름</title>
<rect x="0.5" y="0.5" width="719" height="219" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">받은 파일은 바로 저장해요</text>
<rect x="30.0" y="64" width="200.0" height="96" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="44.0" y="82" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">1</text>
<text x="130.0" y="111.8" font-size="14" fill="#1c2321" text-anchor="middle">채팅방에서</text>
<text x="130.0" y="130.0" font-size="14" fill="#1c2321" text-anchor="middle">파일 받기</text>
<line x1="234.0" y1="112" x2="247.0" y2="112" stroke="#1c2321" stroke-width="1.5"/>
<polygon points="256.0,112 247.0,116.5 247.0,107.5" fill="#1c2321"/>
<rect x="260.0" y="64" width="200.0" height="96" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="274.0" y="82" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">2</text>
<text x="360.0" y="111.8" font-size="14" fill="#1c2321" text-anchor="middle">바로</text>
<text x="360.0" y="130.0" font-size="14" fill="#1c2321" text-anchor="middle">저장하기</text>
<line x1="464.0" y1="112" x2="477.0" y2="112" stroke="#1c2321" stroke-width="1.5"/>
<polygon points="486.0,112 477.0,116.5 477.0,107.5" fill="#1c2321"/>
<rect x="490.0" y="64" width="200.0" height="96" rx="6" fill="#fbeceb" stroke="#b42318" stroke-width="1.5"/>
<text x="504.0" y="82" font-size="12" fill="#b42318" text-anchor="middle" font-weight="bold">3</text>
<text x="590.0" y="111.8" font-size="14" fill="#1c2321" text-anchor="middle">일정 기간이 지나면</text>
<text x="590.0" y="130.0" font-size="14" fill="#1c2321" text-anchor="middle">받을 수 없음</text>
<text x="360" y="192" font-size="13" fill="#5b6663" text-anchor="middle">보관 기간은 카카오도 정확히 알려 주지 않아요</text>
</svg>
