<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">PDF 나누기·쪽 편집의 다섯 가지 저장 방식과 받는 파일</title>
<rect x="0.5" y="0.5" width="719" height="349" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">저장 방식에 따라 받는 파일</text>
<rect x="30" y="64" width="220" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="140" y="87" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">편집한 PDF 하나로</text>
<line x1="256" y1="82" x2="276" y2="82" stroke="#5b6663" stroke-width="2"/>
<polygon points="280,82 272,86 272,78" fill="#5b6663"/>
<rect x="286" y="64" width="404" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="300" y="87" font-size="14" fill="#1c2321">뺀 쪽을 빼고, 돌리고, 순서를 바꾼 PDF 한 개</text>
<rect x="30" y="110" width="220" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="140" y="133" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">고른 쪽만 새 PDF로</text>
<line x1="256" y1="128" x2="276" y2="128" stroke="#5b6663" stroke-width="2"/>
<polygon points="280,128 272,132 272,124" fill="#5b6663"/>
<rect x="286" y="110" width="404" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="300" y="133" font-size="14" fill="#1c2321">체크한 쪽만 담은 PDF 한 개</text>
<rect x="30" y="156" width="220" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="140" y="179" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">범위대로 나누기</text>
<line x1="256" y1="174" x2="276" y2="174" stroke="#5b6663" stroke-width="2"/>
<polygon points="280,174 272,178 272,170" fill="#5b6663"/>
<rect x="286" y="156" width="404" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="300" y="179" font-size="14" fill="#1c2321">입력한 줄마다 PDF 한 개씩 (ZIP)</text>
<rect x="30" y="202" width="220" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="140" y="225" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">몇 쪽씩 나누기</text>
<line x1="256" y1="220" x2="276" y2="220" stroke="#5b6663" stroke-width="2"/>
<polygon points="280,220 272,224 272,216" fill="#5b6663"/>
<rect x="286" y="202" width="404" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="300" y="225" font-size="14" fill="#1c2321">정한 쪽 수만큼 끊은 PDF 여러 개 (ZIP)</text>
<rect x="30" y="248" width="220" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="140" y="271" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">한 쪽씩 나누기</text>
<line x1="256" y1="266" x2="276" y2="266" stroke="#5b6663" stroke-width="2"/>
<polygon points="280,266 272,270 272,262" fill="#5b6663"/>
<rect x="286" y="248" width="404" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="300" y="271" font-size="14" fill="#1c2321">쪽마다 PDF 한 개씩 (ZIP)</text>
<text x="360" y="328" font-size="14" fill="#5b6663" text-anchor="middle">여러 PDF로 나누면 ZIP 파일 하나로 받아요</text>
</svg>
