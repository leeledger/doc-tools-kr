<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">JLPT 온라인 접수와 우편 접수의 사진 내는 법 비교</title>
<rect x="0.5" y="0.5" width="719" height="319" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">JLPT 사진, 온라인과 우편</text>
<rect x="30" y="64" width="320" height="226" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="190" y="92" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">온라인 접수</text>
<text x="54" y="126" font-size="14" fill="#1c2321" text-anchor="start">· JPG 파일 하나</text>
<text x="54" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 3.5×4.5 cm 비율</text>
<text x="54" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 1 MB 이하</text>
<text x="54" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 시험장 직접 고르기</text>
<text x="54" y="246" font-size="14" fill="#1c2321" text-anchor="start">· 추가 접수도 온라인</text>
<rect x="370" y="64" width="320" height="226" rx="6" fill="#fdf4e3" stroke="#8a5a00" stroke-width="1.5"/>
<text x="530" y="92" font-size="16" fill="#8a5a00" text-anchor="middle" font-weight="bold">우편 접수</text>
<text x="394" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 종이 사진 1장</text>
<text x="394" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 뒷면에 이름·생년월일</text>
<text x="394" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 휴대전화번호도 적기</text>
<text x="394" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 시험장은 고를 수 없음</text>
<text x="394" y="246" font-size="14" fill="#1c2321" text-anchor="start">· 일반 접수 기간에만</text>
</svg>
