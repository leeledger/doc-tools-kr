<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">PDF JPG 변환의 선명도 세 가지, 작게·보통·선명의 쓰임 비교</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">선명도 세 가지</text>
<rect x="30" y="64" width="206" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#b45309" font-weight="bold">작게</text>
<line x1="46" y1="108" x2="220" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 파일이 가장 가벼워요</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 메신저로 미리 보여 줄 때</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 작은 글씨는 흐려요</text>
<rect x="256" y="64" width="206" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="274" y="96" font-size="16" fill="#0f766e" font-weight="bold">보통</text>
<line x1="272" y1="108" x2="446" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="274" y="134" font-size="14" fill="#1c2321">· 처음에 골라져 있어요</text>
<text x="274" y="158" font-size="14" fill="#1c2321">· 제출용으로 충분해요</text>
<text x="274" y="182" font-size="14" fill="#1c2321">· 글자가 또렷해요</text>
<rect x="482" y="64" width="206" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="500" y="96" font-size="16" fill="#0f766e" font-weight="bold">선명</text>
<line x1="498" y1="108" x2="672" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="500" y="134" font-size="14" fill="#1c2321">· 작은 글씨까지 크게</text>
<text x="500" y="158" font-size="14" fill="#1c2321">· 파일이 가장 무거워요</text>
<text x="500" y="182" font-size="14" fill="#1c2321">· 한 번에 바꿀 쪽이 줄어요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">받는 곳이 용량을 정해 두었다면 작게나 보통부터 해 보세요</text>
</svg>
