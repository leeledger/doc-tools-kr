<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">TEPS 접수 사진과 성적표 사진을 바꾸는 방법 비교</title>
<rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">사진 바꾸는 길, 두 가지</text>
<rect x="30" y="64" width="320" height="206" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="190" y="92" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">접수 사진</text>
<text x="54" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 접수관리 메뉴에서 직접</text>
<text x="54" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 시험 전 화요일까지</text>
<text x="54" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 50 KB 이하 JPG</text>
<text x="54" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 감독관이 시험장에서 확인</text>
<rect x="370" y="64" width="320" height="206" rx="6" fill="#fdf4e3" stroke="#8a5a00" stroke-width="1.5"/>
<text x="530" y="92" font-size="16" fill="#8a5a00" text-anchor="middle" font-weight="bold">성적표 사진</text>
<text x="394" y="126" font-size="14" fill="#1c2321" text-anchor="start">· 인적사항 수정신청서 작성</text>
<text x="394" y="156" font-size="14" fill="#1c2321" text-anchor="start">· 사진 파일과 1:1 문의로</text>
<text x="394" y="186" font-size="14" fill="#1c2321" text-anchor="start">· 공휴일 빼고 2~3일</text>
<text x="394" y="216" font-size="14" fill="#1c2321" text-anchor="start">· 끝나면 메일로 알려 줘요</text>
</svg>
