<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">PDF의 열 때 비밀번호와 복사·인쇄 사용 제한의 차이</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">PDF에 걸 수 있는 두 가지</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">열 때 비밀번호</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 파일을 열 때마다 물어요</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 모르면 내용을 볼 수 없어요</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 문서딱에서 풀고 걸 수 있어요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b45309" font-weight="bold">사용 제한</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 열 때는 묻지 않아요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 복사·인쇄 같은 일을 막아요</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 만든 곳이 정한 설정이에요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">이 글에서 말하는 암호 풀기·걸기는 왼쪽, 열 때 비밀번호예요</text>
</svg>
