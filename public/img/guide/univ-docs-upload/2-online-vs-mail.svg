<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">대학 원서 서류를 온라인 파일로 낼 때와 우편이나 직접 낼 때의 차이</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">서류를 내는 두 가지 길</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">온라인 파일 제출</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 원서접수 사이트에 파일로</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 형식·크기·이름을 맞춰요</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 윈도우 PC에서 내요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b45309" font-weight="bold">우편·직접 제출</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 봉투 표지를 출력해요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 대봉투 앞면에 붙여요</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 택배·등기·직접 중에서</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">어느 길인지는 대학 모집요강에 나와 있어요</text>
</svg>
