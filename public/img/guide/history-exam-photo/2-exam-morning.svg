<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">한능검 시험 날 아침 시간 흐름과 사진 수정 마감</title>
<rect x="0.5" y="0.5" width="719" height="259" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">시험 날 아침, 사진이 쓰이는 때</text>
<rect x="110" y="106" width="220" height="24" rx="4" fill="#eef0ef" stroke="#9aa7a4" stroke-width="1"/>
<text x="220" y="123" font-size="13" fill="#1c2321" text-anchor="middle">오리엔테이션</text>
<rect x="330" y="106" width="220" height="24" rx="4" fill="#e6f2f0" stroke="#0f766e" stroke-width="1"/>
<text x="440" y="123" font-size="13" fill="#1c2321" text-anchor="middle">감독관이 수험표 사진을 봐요</text>
<line x1="50" y1="140" x2="661" y2="140" stroke="#5b6663" stroke-width="2"/>
<polygon points="670,140 661,144.5 661,135.5" fill="#5b6663"/>
<circle cx="110" cy="140" r="6" fill="#b42318"/>
<text x="110" y="161.6" font-size="13" fill="#b42318" text-anchor="middle" font-weight="bold">10:00</text>
<text x="110" y="178.5" font-size="13" fill="#b42318" text-anchor="middle" font-weight="bold">사진 수정 마감</text>
<circle cx="330" cy="140" r="6" fill="#0f766e"/>
<text x="330" y="161.6" font-size="13" fill="#1c2321" text-anchor="middle">10:10</text>
<text x="330" y="178.5" font-size="13" fill="#1c2321" text-anchor="middle">신분증·수험표 확인</text>
<circle cx="550" cy="140" r="6" fill="#0f766e"/>
<text x="550" y="161.6" font-size="13" fill="#1c2321" text-anchor="middle">10:20</text>
<text x="550" y="178.5" font-size="13" fill="#1c2321" text-anchor="middle">문제지 배부</text>
<text x="360" y="236" font-size="14" fill="#5b6663" text-anchor="middle">사진은 전날까지 고쳐 두고, 수험표를 출력해 얼굴을 확인해요</text>
</svg>
