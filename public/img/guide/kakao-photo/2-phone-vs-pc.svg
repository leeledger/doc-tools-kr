<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">휴대폰 카카오톡과 PC 카카오톡의 사진 전송 한도 비교</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">휴대폰과 PC, 사진 보내는 한도</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">휴대폰 카카오톡</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 한 번에 최대 300MB</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 묶어서 최대 120개</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 30장씩 묶어서 전송</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b45309" font-weight="bold">PC 카카오톡</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 파일 하나에 최대 300MB</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 최대 100개까지</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 끌어다 놓기로도 보내요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">PC 버전이 받는 사진 확장자 목록에 HEIC는 없어요</text>
</svg>
