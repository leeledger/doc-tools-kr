<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">문서딱으로 PDF를 만드는 방법과 한글 프로그램으로 저장하는 방법의 차이</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">두 가지 방법 비교</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">문서딱 HWP PDF 변환</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 설치 없이 휴대폰·PC에서</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 없는 글꼴은 비슷한 글꼴로</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 도형 위치가 다를 수 있어요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b45309" font-weight="bold">한글 프로그램</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 한글이 깔린 PC가 필요해요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 문서 모양이 원본 그대로</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 고친 뒤 바로 다시 저장</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">모양이 꼭 같아야 하는 서류는 한글 프로그램으로 저장하세요</text>
</svg>
