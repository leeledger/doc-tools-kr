<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">메일 첨부 한도는 파일 하나가 아니라 붙인 파일 전체의 합계로 본다는 설명 그림</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">한도는 붙인 파일을 모두 더한 크기</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#b45309" font-weight="bold">파일 하나씩 보면</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 파일마다 한도 아래예요</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 그래서 괜찮아 보여요</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 하지만 합치면 넘칠 수 있어요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#0f766e" font-weight="bold">모두 더해 보면</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 첨부한 파일의 합계를 봐요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 합계가 한도 아래여야 해요</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 넘으면 줄이거나 나눠요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">지메일은 첨부파일이 여러 개면 합계로 한도를 봐요</text>
</svg>
