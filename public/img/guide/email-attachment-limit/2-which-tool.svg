<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">한도를 넘은 첨부파일의 종류별로 쓸 도구를 짝지은 그림</title>
<rect x="0.5" y="0.5" width="719" height="303" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">넘친 파일은 종류에 맞게</text>
<rect x="30" y="64" width="200" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="130" y="87" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">PDF 한 개</text>
<line x1="236" y1="82" x2="256" y2="82" stroke="#5b6663" stroke-width="2"/>
<polygon points="260,82 252,86 252,78" fill="#5b6663"/>
<rect x="266" y="64" width="424" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="280" y="87" font-size="14" fill="#1c2321">PDF 용량 줄이기에서 목표 용량으로 줄이기</text>
<rect x="30" y="110" width="200" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="130" y="133" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">PDF 여러 개</text>
<line x1="236" y1="128" x2="256" y2="128" stroke="#5b6663" stroke-width="2"/>
<polygon points="260,128 252,132 252,124" fill="#5b6663"/>
<rect x="266" y="110" width="424" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="280" y="133" font-size="14" fill="#1c2321">PDF 합치기로 묶은 뒤 한 번에 줄이기</text>
<rect x="30" y="156" width="200" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="130" y="179" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">사진 여러 장</text>
<line x1="236" y1="174" x2="256" y2="174" stroke="#5b6663" stroke-width="2"/>
<polygon points="260,174 252,178 252,170" fill="#5b6663"/>
<rect x="266" y="156" width="424" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="280" y="179" font-size="14" fill="#1c2321">사진 용량 줄이기로 여러 장을 한 번에</text>
<rect x="30" y="202" width="200" height="36" rx="8" fill="#fdf3e7" stroke="#b45309"/>
<text x="130" y="225" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">줄여도 넘칠 때</text>
<line x1="236" y1="220" x2="256" y2="220" stroke="#5b6663" stroke-width="2"/>
<polygon points="260,220 252,224 252,216" fill="#5b6663"/>
<rect x="266" y="202" width="424" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="280" y="225" font-size="14" fill="#1c2321">PDF 나누기로 나눠 메일 여러 통으로</text>
<text x="360" y="282" font-size="14" fill="#5b6663" text-anchor="middle">어느 경우든 한도보다 조금 작게 맞추세요</text>
</svg>
