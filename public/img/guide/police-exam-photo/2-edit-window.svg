<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">경찰 원서 접수기간 안과 뒤에 고칠 수 있는 것</title>
<rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">원서, 언제 무엇을 고칠 수 있나</text>
<rect x="30" y="64" width="420" height="200" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="240" y="90" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">원서접수 기간 안</text>
<rect x="50" y="108" width="185" height="136" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="142" y="150" font-size="15" fill="#1c2321" text-anchor="middle" font-weight="bold">사진·선택과목</text>
<text x="142" y="186.9" font-size="14" fill="#1c2321" text-anchor="middle">원서 수정으로</text>
<text x="142" y="205.1" font-size="14" fill="#1c2321" text-anchor="middle">바로 고쳐요</text>
<rect x="250" y="108" width="185" height="136" rx="6" fill="#ffffff" stroke="#8a5a00" stroke-width="1.5"/>
<text x="342" y="150" font-size="15" fill="#1c2321" text-anchor="middle" font-weight="bold">응시지구</text>
<text x="342" y="186.9" font-size="14" fill="#1c2321" text-anchor="middle">접수 취소 뒤</text>
<text x="342" y="205.1" font-size="14" fill="#1c2321" text-anchor="middle">다시 접수·결제</text>
<rect x="470" y="64" width="220" height="200" rx="6" fill="#fbeceb" stroke="#b42318" stroke-width="1.5"/>
<text x="580" y="90" font-size="16" fill="#b42318" text-anchor="middle" font-weight="bold">기간이 끝나면</text>
<text x="580" y="156.3" font-size="15" fill="#1c2321" text-anchor="middle">사진도 지역도</text>
<text x="580" y="175.8" font-size="15" fill="#1c2321" text-anchor="middle">고칠 수 없어요</text>
<text x="360" y="288" font-size="13" fill="#5b6663" text-anchor="middle">결제 전 확인 화면에서 한 번 더 보는 것이 가장 쉬워요</text>
</svg>
