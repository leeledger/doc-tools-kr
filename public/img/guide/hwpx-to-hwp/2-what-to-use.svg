<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">받는 곳의 요구에 따라 HWPX 파일로 할 일을 짝지은 그림</title>
<rect x="0.5" y="0.5" width="719" height="303" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">받는 곳이 원하는 것에 맞춰</text>
<rect x="30" y="64" width="230" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="145" y="87" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">HWP 파일만 받아요</text>
<line x1="266" y1="82" x2="286" y2="82" stroke="#5b6663" stroke-width="2"/>
<polygon points="290,82 282,86 282,78" fill="#5b6663"/>
<rect x="296" y="64" width="394" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="310" y="87" font-size="14" fill="#1c2321">HWPX HWP 변환으로 바꿔요</text>
<rect x="30" y="110" width="230" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="145" y="133" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">PDF도 받아요</text>
<line x1="266" y1="128" x2="286" y2="128" stroke="#5b6663" stroke-width="2"/>
<polygon points="290,128 282,132 282,124" fill="#5b6663"/>
<rect x="296" y="110" width="394" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="310" y="133" font-size="14" fill="#1c2321">HWP PDF 변환으로 PDF를 만들어요</text>
<rect x="30" y="156" width="230" height="36" rx="8" fill="#e6f3f1" stroke="#0f766e"/>
<text x="145" y="179" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">읽기만 하면 돼요</text>
<line x1="266" y1="174" x2="286" y2="174" stroke="#5b6663" stroke-width="2"/>
<polygon points="290,174 282,178 282,170" fill="#5b6663"/>
<rect x="296" y="156" width="394" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="310" y="179" font-size="14" fill="#1c2321">HWP·HWPX 파일 보기로 열어요</text>
<rect x="30" y="202" width="230" height="36" rx="8" fill="#fdf3e7" stroke="#b45309"/>
<text x="145" y="225" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">아무 말이 없어요</text>
<line x1="266" y1="220" x2="286" y2="220" stroke="#5b6663" stroke-width="2"/>
<polygon points="290,220 282,224 282,216" fill="#5b6663"/>
<rect x="296" y="202" width="394" height="36" rx="8" fill="#f7f9f8" stroke="#c9d1cf"/>
<text x="310" y="225" font-size="14" fill="#1c2321">바꾸지 말고 HWPX 그대로 내도 되는지 물어요</text>
<text x="360" y="282" font-size="14" fill="#5b6663" text-anchor="middle">원래 HWPX 파일은 바뀌지 않고 그대로 남아요</text>
</svg>
