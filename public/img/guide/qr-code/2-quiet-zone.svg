<text x="40" y="404" font-size="14" fill="#0f766e" font-weight="bold">여백 4칸</text>
<text x="185" y="404" font-size="14" fill="#1c2321" text-anchor="middle">버전 1: 21×21칸</text>
<text x="370" y="110" font-size="16" fill="#1c2321" font-weight="bold">여백(초록 칸)</text>
<text x="370" y="134" font-size="15" fill="#1c2321">아무것도 없는 흰 테두리예요.</text>
<text x="370" y="158" font-size="15" fill="#1c2321">상하좌우 4칸 이상 둬요.</text>
<text x="370" y="210" font-size="16" fill="#1c2321" font-weight="bold">칸 수</text>
<text x="370" y="234" font-size="15" fill="#1c2321">버전 1은 21×21칸이에요.</text>
<text x="370" y="258" font-size="15" fill="#1c2321">버전이 오를 때마다</text>
<text x="370" y="282" font-size="15" fill="#1c2321">가로·세로 4칸씩 늘어요.</text>
<text x="370" y="306" font-size="15" fill="#1c2321">버전 40은 177×177칸이에요.</text>
<text x="32" y="440" font-size="13" fill="#5b6663">출처: QRcode.com (DENSO WAVE) 「마진(여백) 확보」와 「QR코드의 정보량과 버전」 안내.</text>
<text x="32" y="462" font-size="13" fill="#5b6663">그림 속 QR에는 「docttak.com」을 담아 버전 1, 오류 복원 레벨 M으로 그렸어요.</text>
