<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">사진 PDF 변환의 용지 A4와 사진 크기에 맞춤의 차이</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">용지를 고르면 쪽 모양이 달라져요</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">A4</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 쪽은 늘 A4 크기예요</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 사진은 가운데에 비율대로</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 서류 제출·인쇄에 맞아요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdf3e7" stroke="#b45309" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b45309" font-weight="bold">사진 크기에 맞춤</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b45309" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 쪽 모양이 사진과 같아요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 흰 여백이 생기지 않아요</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 화면으로 볼 때 맞아요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">A4를 고르면 방향과 여백도 정할 수 있어요</text>
</svg>
