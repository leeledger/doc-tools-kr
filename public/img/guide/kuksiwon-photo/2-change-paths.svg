<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">국시원 원서 사진을 바꾸는 두 가지 길</title>
<rect x="0.5" y="0.5" width="719" height="289" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">접수한 뒤 사진 바꾸기, 두 갈래</text>
<rect x="30" y="64" width="320" height="190" rx="6" fill="#e6f2f0" stroke="#0f766e" stroke-width="1.5"/>
<text x="190" y="92" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">시험일 7일 전까지</text>
<text x="190" y="131.8" font-size="14" fill="#1c2321" text-anchor="middle">마이페이지</text>
<text x="190" y="150" font-size="14" fill="#1c2321" text-anchor="middle">→ 응시원서관리</text>
<text x="190" y="168.2" font-size="14" fill="#1c2321" text-anchor="middle">→ 응시원서 수정</text>
<text x="190" y="226" font-size="14" fill="#5b6663" text-anchor="middle">직접 고치면 바로 끝나요</text>
<rect x="370" y="64" width="320" height="190" rx="6" fill="#fdf4e3" stroke="#8a5a00" stroke-width="1.5"/>
<text x="530" y="92" font-size="15" fill="#8a5a00" text-anchor="middle" font-weight="bold">시험 다음 날부터 서류 처리 전까지</text>
<text x="530" y="131.8" font-size="14" fill="#1c2321" text-anchor="middle">마이페이지</text>
<text x="530" y="150" font-size="14" fill="#1c2321" text-anchor="middle">→ 나의 정보관리</text>
<text x="530" y="168.2" font-size="14" fill="#1c2321" text-anchor="middle">→ 개인정보 정정 신청</text>
<text x="530" y="226" font-size="14" fill="#5b6663" text-anchor="middle">담당자 승인 약 3일, 결과는 문자로</text>
</svg>
