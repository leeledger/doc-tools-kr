<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">아기 첫 여권 신청 준비물</title>
<rect x="0.5" y="0.5" width="719" height="319" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="36" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">아기 첫 여권, 창구에 가져갈 것</text>
<circle cx="70" cy="82" r="11" fill="#0f766e"/><path d="M65 82 l3.5 4 l6.5 -8" fill="none" stroke="#ffffff" stroke-width="2.4"/>
<text x="92" y="87" font-size="15" fill="#1c2321" text-anchor="start">여권발급신청서</text>
