<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title id="t">배경이 투명한 PNG 서명과 흰 배경이 있는 JPG 서명을 서명란에 놓았을 때의 차이</title>
<rect x="0.5" y="0.5" width="719" height="251" rx="8" fill="#ffffff" stroke="#c9d1cf"/>
<text x="360" y="38" font-size="18" fill="#1c2321" text-anchor="middle" font-weight="bold">서명란 위에 올렸을 때</text>
<rect x="30" y="64" width="320" height="128" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/>
<text x="48" y="96" font-size="16" fill="#0f766e" font-weight="bold">투명 PNG</text>
<line x1="46" y1="108" x2="334" y2="108" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="48" y="134" font-size="14" fill="#1c2321">· 서명 둘레가 비어 있어요</text>
<text x="48" y="158" font-size="14" fill="#1c2321">· 밑줄과 (인) 글자가 보여요</text>
<text x="48" y="182" font-size="14" fill="#1c2321">· 서명란에 자연스럽게 얹혀요</text>
<rect x="370" y="64" width="320" height="128" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="2"/>
<text x="388" y="96" font-size="16" fill="#b91c1c" font-weight="bold">흰 배경 JPG</text>
<line x1="386" y1="108" x2="674" y2="108" stroke="#b91c1c" stroke-opacity="0.4"/>
<text x="388" y="134" font-size="14" fill="#1c2321">· 서명 둘레에 흰 네모가 있어요</text>
<text x="388" y="158" font-size="14" fill="#1c2321">· 밑줄과 글자를 가려요</text>
<text x="388" y="182" font-size="14" fill="#1c2321">· 붙여 넣은 티가 나요</text>
<text x="360" y="230" font-size="14" fill="#5b6663" text-anchor="middle">흰 네모가 보이면 배경을 지운 PNG로 바꿔 넣으세요</text>
</svg>
